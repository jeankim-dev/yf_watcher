<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ '한국' if market == 'KR' else '미국' }} 상대 강도 (RS) 분석</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; max-width: 1000px; margin: 0 auto; padding: 20px; background-color: #f5f5f7; }
        .container { background-color: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .market-toggle { text-align: center; margin-bottom: 20px; }
        .market-toggle a { margin: 0 10px; color: #0071e3; text-decoration: none; font-weight: bold; padding: 5px 10px; border-radius: 5px; }
        .market-toggle a.active { background-color: #0071e3; color: white; }
        h1 { color: #1d1d1f; text-align: center; margin-bottom: 30px; }
        .form-group { display: flex; justify-content: center; gap: 10px; margin-bottom: 40px; }
        input[type="text"] { padding: 12px 15px; border: 1px solid #d2d2d7; border-radius: 8px; width: 350px; font-size: 16px; }
        button { padding: 12px 25px; background-color: #0071e3; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; }
        button:hover { background-color: #0077ed; }
        .charts-container { display: flex; flex-direction: column; gap: 40px; }
        .chart-wrapper { background-color: white; border: 1px solid #d2d2d7; border-radius: 8px; padding: 10px; min-height: 400px; }
        .info { text-align: center; margin-bottom: 25px; color: #1d1d1f; font-size: 18px; }
        .error { color: #ff3b30; text-align: center; margin-bottom: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="market-toggle">
            <a href="/rs" class="{{ 'active' if market == 'US' else '' }}">🇺🇸 미국 주식</a>
            <a href="/rskr" class="{{ 'active' if market == 'KR' else '' }}">🇰🇷 한국 주식</a>
        </div>
        <h1>{{ '한국' if market == 'KR' else '미국' }} Relative Strength 분석</h1>
        
        <form action="{{ '/rskr' if market == 'KR' else '/rs' }}" method="post" class="form-group">
            <input type="text" name="ticker" 
                   placeholder="{{ '종목명 또는 코드 입력 (예: 삼성전자, 005930)' if market == 'KR' else '티커 또는 종목명 입력 (예: NVDA, Apple)' }}" 
                   value="{{ ticker if ticker else '' }}" required>
            <button type="submit">분석 실행</button>
        </form>

        {% if error %}
            <div class="error">⚠️ {{ error }}</div>
        {% endif %}

        {% if symbol and not error %}
            <div class="info">
                📊 <strong>{{ symbol }}</strong> (섹터: {{ sector_name }} | 지수: {{ index_name }} | 대응 ETF: {{ sector_etf }})
            </div>
            <div class="charts-container">
                <div class="chart-wrapper" id="chart1"></div>
                <div class="chart-wrapper" id="chart2"></div>
                <div class="chart-wrapper" id="chart3"></div>
            </div>

            <script>
                const config = { responsive: true, displayModeBar: false };
                const renderChart = (id, jsonStr) => {
                    const fig = JSON.parse(jsonStr);
                    Plotly.newPlot(id, fig.data, fig.layout, config);
                };
                renderChart('chart1', `{{ chart1_json | safe }}`);
                renderChart('chart2', `{{ chart2_json | safe }}`);
                renderChart('chart3', `{{ chart3_json | safe }}`);
            </script>
        {% endif %}
    </div>
</body>
</html>
